# The first website release changes this to two. Keeping zero replicas here
# lets the GitOps structure merge before the first image exists in GHCR.
replicaCount: 0

image:
  repository: ghcr.io/israelsz/israheck-website
  tag: site-bootstrap
  digest: ""
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 5m
    memory: 8Mi
    ephemeral-storage: 4Mi
  limits:
    cpu: 100m
    memory: 32Mi
    ephemeral-storage: 16Mi

