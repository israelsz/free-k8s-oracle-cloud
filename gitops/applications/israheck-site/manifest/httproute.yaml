apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: israheck-site
  namespace: israheck-site
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    external-dns.alpha.kubernetes.io/expose: public
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: envoy-gateway-system
      sectionName: israheck-https
  hostnames:
    - israheck.com
  rules:
    # Astro fingerprints these files, so browsers can keep them for a year.
    - matches:
        - path:
            type: PathPrefix
            value: /_astro/
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Cache-Control
                value: public, max-age=31536000, immutable
              - name: Strict-Transport-Security
                value: max-age=31536000; includeSubDomains
              - name: X-Content-Type-Options
                value: nosniff
              - name: X-Frame-Options
                value: DENY
              - name: Referrer-Policy
                value: strict-origin-when-cross-origin
      backendRefs:
        - group: ""
          kind: Service
          name: israheck-site
          port: 80
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Cache-Control
                value: no-cache
              - name: Strict-Transport-Security
                value: max-age=31536000; includeSubDomains
              - name: X-Content-Type-Options
                value: nosniff
              - name: X-Frame-Options
                value: DENY
              - name: Referrer-Policy
                value: strict-origin-when-cross-origin
      backendRefs:
        - group: ""
          kind: Service
          name: israheck-site
          port: 80
          weight: 1

