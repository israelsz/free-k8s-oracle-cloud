apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: israheck-site
  namespace: argocd
  annotations:
    # The shared public edge must accept this namespace before the route starts.
    argocd.argoproj.io/sync-wave: "-4"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: israheck-site
  sources:
    # This local chart owns the Deployment, Service and disruption budget.
    - repoURL: https://github.com/israelsz/free-k8s-oracle-cloud.git
      targetRevision: main
      path: gitops/applications/israheck-site/chart
      helm:
        releaseName: israheck-site
        valueFiles:
          - $values/gitops/applications/israheck-site/values.yaml

    # The second source exposes the values file to the local Helm chart.
    - repoURL: https://github.com/israelsz/free-k8s-oracle-cloud.git
      targetRevision: main
      ref: values

    # Namespace, routing and isolation rules stay beside the application.
    - repoURL: https://github.com/israelsz/free-k8s-oracle-cloud.git
      targetRevision: main
      path: gitops/applications/israheck-site/manifest
      kustomize: {}
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - FailOnSharedResource=true

