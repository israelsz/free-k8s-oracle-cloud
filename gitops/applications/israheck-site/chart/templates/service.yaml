apiVersion: v1
kind: Service
metadata:
  name: israheck-site
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: israheck-site
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: israheck-site
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: http

