---
# The certificate lives with the shared Gateway because Gateway listeners can
# only reference Secrets in their own namespace by default.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kaneo
  namespace: envoy-gateway-system
spec:
  secretName: kaneo-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-production
  dnsNames:
    - kaneo.labrats.cl
