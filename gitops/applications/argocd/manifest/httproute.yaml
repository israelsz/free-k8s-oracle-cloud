apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  annotations:
    # ExternalDNS ignores every route without this explicit opt-in.
    external-dns.alpha.kubernetes.io/expose: public
    # Cloudflare answers publicly and proxies HTTPS to the OCI origin.
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    # Gateway and certificates are established before application routes.
    argocd.argoproj.io/sync-wave: "1"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: envoy-gateway-system
      sectionName: argocd-https
  hostnames:
    - argocd.israheck.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # Port 443 is re-encrypted and verified by argocd-server's
        # BackendTLSPolicy, which is rendered by the Argo CD Helm chart.
        - group: ""
          kind: Service
          name: argocd-server
          port: 443
          weight: 1
