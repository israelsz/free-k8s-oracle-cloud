apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kaneo-mcp
  namespace: kaneo
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: kaneo-https
  hostnames:
    - kaneo.labrats.cl
  rules:
    # Exact matches deliberately exclude browser authorization/consent and
    # ordinary API routes. Those retain kaneo-google-oidc on the kaneo route.
    # Kaneo validates the bearer session on every MCP transport request.
    # Access removal must revoke Kaneo sessions as well as the Google allowlist
    # entry: existing bearer sessions do not recheck that Envoy allowlist.
    - matches:
        - path:
            type: Exact
            value: /api/mcp
        - method: POST
          path:
            type: Exact
            value: /api/mcp/register
        - method: POST
          path:
            type: Exact
            value: /api/mcp/token
        - method: GET
          path:
            type: Exact
            value: /.well-known/oauth-protected-resource/api/mcp
        - method: GET
          path:
            type: Exact
            value: /.well-known/oauth-authorization-server/api
        - method: GET
          path:
            type: Exact
            value: /api/.well-known/oauth-protected-resource/api/mcp
        - method: GET
          path:
            type: Exact
            value: /api/.well-known/oauth-authorization-server/api
      backendRefs:
        # Actual chart-rendered service name
        - name: kaneo-kaneo
          port: 5173
