apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: kaneo-google-oidc
  namespace: kaneo
  annotations:
    # Install the policy object before the chart exposes its wave-2 HTTPRoute.
    argocd.argoproj.io/sync-wave: "1"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: kaneo

  # Envoy owns the public login flow. Requests without a valid session are sent
  # to Google before they can reach either Kaneo's frontend or API.
  oidc:
    provider:
      issuer: https://accounts.google.com
      # Avoid controller-side discovery: the controller intentionally has no
      # internet egress. Proxy pods use these endpoints during browser login.
      authorizationEndpoint: https://accounts.google.com/o/oauth2/v2/auth
      tokenEndpoint: https://oauth2.googleapis.com/token
    clientIDRef:
      name: kaneo-auth
    clientSecret:
      name: kaneo-auth
    redirectURL: https://kaneo.labrats.cl/oauth2/callback
    logoutPath: /oauth2/logout
    scopes:
      - email
      - profile
    # Stable, app-specific names let JWT validate the ID token and prevent an
    # older Envoy session from bypassing creation of the new ID-token cookie.
    cookieNames:
      accessToken: KaneoAccessToken
      idToken: KaneoIdToken

  # Google access tokens are opaque, so validate the signed ID token stored by
  # the preceding OIDC filter using Google's published keys.
  jwt:
    providers:
      - name: google
        issuer: https://accounts.google.com
        remoteJWKS:
          uri: https://www.googleapis.com/oauth2/v3/certs
        extractFrom:
          cookies:
            - KaneoIdToken

  # Deny is the default. Google `sub` values are stable account identifiers,
  # so the allowlist does not expose users' email addresses in Git.
  authorization:
    defaultAction: Deny
    rules:
      - name: allow-kaneo-users
        action: Allow
        principal:
          jwt:
            provider: google
            claims:
              - name: sub
                values:
                  - "108921963364692021455"
                  - "112245730480385023329"
                  - "113447627997405952849"
