apiVersion: v1
kind: ServiceAccount
metadata:
  # External Secrets uses this identity only to read Kaneo's single OpenBao
  # document. The pod running Kaneo does not receive an OpenBao token.
  name: kaneo-openbao-reader
  namespace: kaneo
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: kaneo
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    vault:
      server: https://openbao-active.openbao.svc.cluster.local:8200
      path: secret
      version: v2
      # trust-manager writes this CA ConfigMap because the namespace opts in
      # through the `openbao-trust` label in application.yaml.
      caProvider:
        type: ConfigMap
        name: openbao-internal-ca
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: k8s-prod-kaneo-auth
          serviceAccountRef:
            name: kaneo-openbao-reader
            audiences:
              - openbao
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kaneo-auth
  namespace: kaneo
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    # Kaneo and Envoy both read this Secret. The duplicated key names below are
    # intentional: Kaneo expects google-client-*, while Envoy Gateway requires
    # the fixed client-id/client-secret keys for its Secret references.
    name: kaneo-auth
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: auth-secret
      remoteRef:
        key: prod/kaneo/auth
        property: auth_secret
    - secretKey: google-client-id
      remoteRef:
        key: prod/kaneo/auth
        property: google_client_id
    - secretKey: google-client-secret
      remoteRef:
        key: prod/kaneo/auth
        property: google_client_secret
    - secretKey: client-id
      remoteRef:
        key: prod/kaneo/auth
        property: google_client_id
    - secretKey: client-secret
      remoteRef:
        key: prod/kaneo/auth
        property: google_client_secret
