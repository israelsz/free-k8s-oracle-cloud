apiVersion: v1
kind: ServiceAccount
metadata:
  # External Secrets exchanges this identity for a short-lived OpenBao token.
  name: grafana-openbao-reader
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  provider:
    vault:
      server: https://openbao-active.openbao.svc.cluster.local:8200
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: openbao-internal-ca
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: k8s-prod-monitoring-grafana-auth
          serviceAccountRef:
            name: grafana-openbao-reader
            audiences:
              - openbao
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-auth
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: grafana-auth
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    # Standard GF_* names let the same Secret configure Grafana and provide its
    # break-glass administrator without copying values into Helm.
    - secretKey: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
      remoteRef:
        key: prod/monitoring/grafana/google-oidc
        property: clientID
    - secretKey: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
      remoteRef:
        key: prod/monitoring/grafana/google-oidc
        property: clientSecret
    - secretKey: OIDC_ALLOWED_EMAIL
      remoteRef:
        key: prod/monitoring/grafana/google-oidc
        property: allowedEmail
    - secretKey: GF_SECURITY_ADMIN_USER
      remoteRef:
        key: prod/monitoring/grafana/admin
        property: username
    - secretKey: GF_SECURITY_ADMIN_PASSWORD
      remoteRef:
        key: prod/monitoring/grafana/admin
        property: password
