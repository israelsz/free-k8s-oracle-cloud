apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: retina
  namespace: argocd
  annotations:
    # The monitoring parent creates the host-access namespace and its policy
    # guardrails before this child starts a collector on every worker.
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: node-observability
  sources:
    # Retina supplies pod-aware network metrics that OKE's VCN-native kubelet
    # cAdvisor endpoint does not expose.
    - repoURL: ghcr.io/microsoft/retina/charts
      chart: retina
      targetRevision: v1.2.3
      helm:
        releaseName: retina
        # The upstream connection-test Pod is a Helm test, not a continuously
        # reconciled workload.
        skipTests: true
        valueFiles:
          - $values/gitops/applications/monitoring/retina/values.yaml

    - repoURL: https://github.com/israelsz/free-k8s-oracle-cloud.git
      targetRevision: main
      ref: values

    # VictoriaMetrics discovery stays beside the collector it integrates.
    - repoURL: https://github.com/israelsz/free-k8s-oracle-cloud.git
      targetRevision: main
      path: gitops/applications/monitoring/retina/manifest

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 20
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
