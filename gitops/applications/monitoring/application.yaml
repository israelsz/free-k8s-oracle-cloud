apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # This parent keeps the monitoring components grouped without teaching the
  # cluster-wide bootstrap about their nested directory structure.
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  sources:
    # Only the two direct child Application manifests are rendered here.
    # Their values and workload manifests remain owned by each child.
    - repoURL: https://github.com/israelsz/free-k8s-oracle-cloud.git
      targetRevision: main
      path: gitops/applications/monitoring
      directory:
        recurse: true
        include: "*/application.yaml"

    # Namespace labels and shared storage guardrails must exist before either
    # child chart starts creating workloads.
    - repoURL: https://github.com/israelsz/free-k8s-oracle-cloud.git
      targetRevision: main
      path: gitops/applications/monitoring/manifest

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
