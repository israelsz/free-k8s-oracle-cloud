apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-logs-collector
  namespace: argocd
  annotations:
    # Start after the stack has declared the VictoriaLogs destination.
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: node-observability
  sources:
    - repoURL: https://victoriametrics.github.io/helm-charts/
      chart: victoria-logs-collector
      targetRevision: 0.3.7
      helm:
        releaseName: victoria-logs-collector
        valueFiles:
          - $values/gitops/applications/monitoring/victoria-logs-collector/values.yaml

    - repoURL: https://github.com/israelsz/free-k8s-oracle-cloud.git
      targetRevision: main
      ref: values

    - repoURL: https://github.com/israelsz/free-k8s-oracle-cloud.git
      targetRevision: main
      path: gitops/applications/monitoring/victoria-logs-collector/manifest

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 20
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
